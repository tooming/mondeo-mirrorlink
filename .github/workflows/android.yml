name: Android CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          # Without this, setup-gradle never persists configuration-cache
          # state across separate runs (each a fresh VM) at all - the
          # org.gradle.configuration-cache=true flag in gradle.properties
          # is otherwise a safe no-op in CI specifically, confirmed live
          # (#2): two consecutive runs both logged "Calculating task graph
          # as no cached configuration is available" before this was added.
          # Configuration-cache entries can retain resolved build inputs,
          # so the action encrypts them at rest with this key rather than
          # caching the plain content - a repo secret, not a real Gradle
          # signing/publishing credential.
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.jks"

      - name: Assemble signed release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace \
            -PSIGNING_KEYSTORE_PATH="$SIGNING_KEYSTORE_PATH" \
            -PKEYSTORE_PASSWORD="$SIGNING_KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$SIGNING_KEY_ALIAS" \
            -PKEY_PASSWORD="$SIGNING_KEY_PASSWORD"

      - uses: actions/upload-artifact@v4
        with:
          name: mondeo-mirrorlink
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish to rolling "latest" GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if gh release view latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload latest "$APK" --clobber --repo "${{ github.repository }}"
          else
            gh release create latest "$APK" \
              --title "Latest build" \
              --notes "Automated build from ${{ github.sha }}. Sideload app-release.apk directly - no GitHub login needed." \
              --repo "${{ github.repository }}"
          fi
