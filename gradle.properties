org.gradle.jvmargs=-Xmx2048m
org.gradle.caching=true
# Skips re-running the configuration phase (evaluating build.gradle.kts/
# settings.gradle.kts, applying AGP/Kotlin plugins) when nothing relevant
# has changed since the last run (#2). Safe with the signing setup in
# app/build.gradle.kts: secrets are read via -P project properties
# (findProperty), which the configuration cache tracks as real inputs -
# not System.getenv(), which it wouldn't see change and would need
# providers.environmentVariable() to track correctly.
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
